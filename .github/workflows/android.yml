name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Oyunu paketle
        run: |
          npm ci
          ./build-app.sh
          npx cap sync android

      - name: Test APK (telefona doğrudan kurulur)
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: kafe-zinciri-test-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Test APK'sını Releases'a koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Test sürümü ${{ github.run_number }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: Telefona doğrudan kurulabilen Android test paketi (imzasız, mağaza için değil).

      - name: İmzalı mağaza paketi (AAB)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload.keystore
          export ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore
          ./gradlew bundleRelease -PversionCode=${{ github.run_number }}

      - name: AAB'yi Releases'a ekle (Play Console'a elle yüklemek için)
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          files: android/app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: kafe-zinciri-play-${{ github.run_number }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Google Play iç teste yükle
        if: env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.arcbyte.cafesimulator
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
